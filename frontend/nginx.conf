map $http_x_forwarded_proto $oneb_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;

  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # O bundle usa URLs /api relativas. Assim cookie, CORS e TLS ficam no mesmo
  # dominio publico, enquanto a API permanece acessivel apenas na rede do Compose.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $oneb_forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
