map $http_x_forwarded_proto $oneb_forwarded_proto {
  default $scheme;
  https https;
  "" $scheme;
}

server {
  listen 80;
  server_name _;

  server_tokens off;

  # Compressão: o bundle (290 KB -> ~93 KB) e o JSON da API (gráfico de 5 dias ~133 KB)
  # iam sem compressão, o que pesava muito no primeiro acesso pelo celular.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  root /usr/share/nginx/html;
  index index.html;

  # O bundle usa URLs /api relativas. Assim cookie, CORS e TLS ficam no mesmo
  # dominio publico, enquanto a API permanece acessivel apenas na rede do Compose.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $oneb_forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Arquivos com hash no nome (gerados pelo Vite) nunca mudam: cache de 1 ano.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # index.html sempre revalidado, para o navegador achar o bundle novo depois de um deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
