name: oneb

x-app-environment: &app-environment
  ENVIRONMENT: production
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-oneb}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-oneb}
  RUN_EMBEDDED_SCHEDULER: "false"

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  image: oneb-backend:${APP_VERSION:-latest}
  env_file:
    - ${APP_ENV_FILE:-.env.production}
  environment: *app-environment
  init: true
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oneb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-oneb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    <<: *app-common
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-common
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    volumes:
      - appdata:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  worker:
    <<: *app-common
    command: python -m app.worker
    volumes:
      - appdata:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

  paper-simulator:
    <<: *app-common
    command: python -m app.paper_simulator
    environment:
      <<: *app-environment
      PAPER_SIM_INTERVAL_SECONDS: ${PAPER_SIM_INTERVAL_SECONDS:-300}
      PAPER_SIM_DATA_DIR: /app/data
    volumes:
      - appdata:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Vazio = chamadas /api no mesmo dominio, encaminhadas pelo Nginx.
        VITE_API_URL: ""
    image: oneb-frontend:${APP_VERSION:-latest}
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
