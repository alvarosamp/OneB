[project]
name = "oneb-market"
version = "0.1.0"
description = "OneB Market - monitoramento de mercado (nao executa ordens)"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.139.2", "uvicorn>=0.30", "sqlalchemy>=2.0", "alembic>=1.13",
    "psycopg[binary]>=3.2", "pydantic>=2.9", "pydantic-settings>=2.5",
    "apscheduler>=3.10,<4", "python-telegram-bot>=21.6", "pandas>=2.2",
    "numpy>=1.26", "scikit-learn>=1.9", "yfinance>=0.2.44", "finnhub-python>=2.4.20",
    "bcrypt>=4.0", "PyJWT>=2.9", "httpx>=0.27", "python-dotenv>=1.0",
    "reportlab>=4.2",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40", "google-generativeai>=0.8", "groq>=0.11"]

[tool.vercel]
entrypoint = "serverless:app"

[tool.vercel.fastapi.static]
cdn = true

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data", "tmp", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",
    # Depends()/Header()/Cookie() em default de argumento e o idioma padrao do FastAPI:
    # a alternativa que o B008 sugere quebraria a injecao de dependencia.
    "B008",
    # UP017 (timezone.utc -> datetime.UTC) e UP042 (str+Enum -> StrEnum) sao mudancas
    # estilisticas que atingem centenas de linhas do codigo existente sem alterar
    # comportamento. Ficam de fora ate haver uma limpeza dedicada.
    "UP017",
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# scripts/ sao experimentos de pesquisa (EDA, backtests exploratorios), nao codigo de
# producao: import nao usado ou zip() sem strict= ali nao deve travar o CI da aplicacao.
"scripts/*" = ["F401", "F841", "B905", "B007", "E402", "E731", "F541"]
